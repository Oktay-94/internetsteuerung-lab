name: Live-Demo

on:
  push:
    branches: [main]
    paths:
      - src/Internetsteuerung.Core/**
      - src/Internetsteuerung.Demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Blazor WebAssembly bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish src/Internetsteuerung.Demo -c Release -o out
      - name: Für GitHub Pages anpassen
        # Pages serves the site under /<repo>/; 404.html lets deep links like /protokoll load the app.
        run: |
          sed -i 's|<base href="/" />|<base href="/internetsteuerung-lab/" />|' out/wwwroot/index.html
          grep -q '<base href="/internetsteuerung-lab/" />' out/wwwroot/index.html
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
