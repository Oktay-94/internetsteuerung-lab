name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build und Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (alle Projekte, Warnungen gelten als Fehler)
        run: dotnet build Internetsteuerung.sln -c Release
      - name: Unit-Tests
        run: dotnet test tests/Internetsteuerung.Tests -c Release --no-build --logger "console;verbosity=normal"

  winforms:
    name: WinForms-Client (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/Internetsteuerung.WinForms -c Release

  lab:
    name: Container-Lab End-to-End
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Lab starten
        run: scripts/lab.sh up
      - name: Smoke-Test (Sperre, automatische Freigabe, Zugangsschutz)
        run: scripts/lab.sh smoke
      - name: Logs bei Fehler
        if: failure()
        run: docker compose -f lab/docker-compose.yml logs --tail 100
      - name: Aufräumen
        if: always()
        run: scripts/lab.sh down
